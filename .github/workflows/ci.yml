name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: |
          node --check dist/store-data.js
          node --check dist/app.js
          node --check dist/cms.js
          node --check test-store.js
          node --check test-browser.cjs
      - name: Verify stores.json matches stores.csv
        run: |
          node build-data.mjs
          git diff --exit-code -- dist/stores.json
      - name: Store data tests
        run: node test-store.js
